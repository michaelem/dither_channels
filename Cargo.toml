[package]
name = "dither_channels"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.36.2", optional = true }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
png = "0.18.1"
rfd = { version = "0.17.2", optional = true }

[features]
default = ["gui"]
# Build the CLI alone, without the UI toolkit: cargo build --no-default-features
gui = ["dep:eframe", "dep:rfd", "dep:muda", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:raw-window-handle"]

[[bin]]
name = "dither_gui"
required-features = ["gui"]

# Native menu bar on macOS; other platforms get an in-window menu bar.
# The objc2 crates put the translucent macOS sidebar material behind the window.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.0", optional = true }
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSVisualEffectView", "NSGraphics"], optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString"], optional = true }
raw-window-handle = { version = "0.6.2", optional = true }
